
name: Build Sider 3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Compile Sider
        shell: cmd
        run: |
          @echo off
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\VC\Auxiliary\Build\vcvarsall.bat" x86 -vcvars_ver=14.29
          if errorlevel 1 call "%VSROOT%\VC\Auxiliary\Build\vcvarsall.bat" x86
          if errorlevel 1 exit /b 1
          nmake

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: sider3-build
          path: |
            sider.exe
            sider.dll
            soft/LuaJIT-2.0.4/src/lua51.dll
